services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    command: sh -c "ln -sf /app/data/database.db /app/database.db && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - backend-db:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  backend-db:
